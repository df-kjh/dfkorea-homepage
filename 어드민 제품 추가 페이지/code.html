<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lumina Admin - Add Product</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#22a8c3",
                        "background-light": "#f9fafa",
                        "background-dark": "#1c1f22",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
<style>.dashed-border {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCNW9YZCAZnb1Z-eMKtOjfvWp-xFbYUIwswUdjE85udnFGEY1r6CwXulnLytTzBN32ernOyos-z_EmJb88VcBW1onD_bEJU51Ws-nfVfG8XXK6mnZ-1FapX122aspiEKwJZshCEXtLJZ1fV2RLDrL7yql0TTX77nrnzFgPZhsSHRTOtjylgZ_LAICc3b9VMIGxa76g9Lf-QwSH7aXHNCycAzrWC5bhiQJ6yrqa92Os2kZliN2_axQ7AsKlKG2CKPqZLcuYhGq-HInc)
    }
input:focus, textarea:focus {
    border-color: #22a8c3 !important;
    box-shadow: none !important
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#121617] dark:text-gray-100 min-h-screen pb-24">
<!-- Top Navigation Bar -->
<nav class="sticky top-0 z-50 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center justify-between p-4 h-16">
<div class="flex items-center gap-3">
<button class="flex items-center justify-center size-10 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight">Add New Product</h1>
</div>
<button class="flex items-center justify-center size-10">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</div>
</nav>
<main class="max-w-xl mx-auto px-4 py-6 space-y-6">
<!-- General Information Card -->
<section class="bg-white dark:bg-gray-900 p-5 rounded shadow-[0_2px_15px_-3px_rgba(0,0,0,0.07)] border border-gray-50 dark:border-gray-800">
<h2 class="text-xs font-bold uppercase tracking-widest text-primary mb-4">General Information</h2>
<div class="space-y-5">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold">Product Title</label>
<input class="w-full bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 rounded-lg h-12 px-4 focus:ring-0 transition-all placeholder:text-gray-400" placeholder="e.g. Pro-Series High Bay LED" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold">Subtitle/Summary</label>
<textarea class="w-full bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 rounded-lg min-h-[100px] p-4 focus:ring-0 transition-all placeholder:text-gray-400" placeholder="A brief summary for search results..."></textarea>
</div>
</div>
</section>
<!-- Media Card -->
<section class="bg-white dark:bg-gray-900 p-5 rounded shadow-[0_2px_15px_-3px_rgba(0,0,0,0.07)] border border-gray-50 dark:border-gray-800">
<h2 class="text-xs font-bold uppercase tracking-widest text-primary mb-4">Product Image</h2>
<div class="dashed-border relative group cursor-pointer h-40 flex flex-col items-center justify-center gap-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-3xl text-gray-400 group-hover:text-primary transition-colors">add_photo_alternate</span>
<p class="text-sm font-medium text-gray-500">Tap to upload thumbnail</p>
<p class="text-[10px] text-gray-400">JPG, PNG or WebP up to 5MB</p>
</div>
</section>
<!-- Technical Specifications Card -->
<section class="bg-white dark:bg-gray-900 p-5 rounded shadow-[0_2px_15px_-3px_rgba(0,0,0,0.07)] border border-gray-50 dark:border-gray-800">
<h2 class="text-xs font-bold uppercase tracking-widest text-primary mb-4">Technical Specs</h2>
<div class="space-y-6">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold">LED Power</label>
<div class="relative">
<input class="w-full bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 rounded-lg h-12 pl-4 pr-16 focus:ring-0 transition-all" placeholder="150" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-bold text-gray-400">WATTS</span>
</div>
</div>
<div class="flex flex-col gap-3">
<label class="text-sm font-semibold">Certifications</label>
<div class="grid grid-cols-2 gap-3">
<label class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-800 rounded-lg border border-transparent cursor-pointer has-[:checked]:border-primary/50 has-[:checked]:bg-primary/5">
<input checked="" class="rounded-sm border-gray-300 text-primary focus:ring-0" type="checkbox"/>
<span class="text-sm font-medium">CE Marked</span>
</label>
<label class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-800 rounded-lg border border-transparent cursor-pointer has-[:checked]:border-primary/50 has-[:checked]:bg-primary/5">
<input class="rounded-sm border-gray-300 text-primary focus:ring-0" type="checkbox"/>
<span class="text-sm font-medium">UL Listed</span>
</label>
<label class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-800 rounded-lg border border-transparent cursor-pointer has-[:checked]:border-primary/50 has-[:checked]:bg-primary/5">
<input checked="" class="rounded-sm border-gray-300 text-primary focus:ring-0" type="checkbox"/>
<span class="text-sm font-medium">RoHS</span>
</label>
<label class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-800 rounded-lg border border-transparent cursor-pointer has-[:checked]:border-primary/50 has-[:checked]:bg-primary/5">
<input class="rounded-sm border-gray-300 text-primary focus:ring-0" type="checkbox"/>
<span class="text-sm font-medium">Energy Star</span>
</label>
</div>
</div>
</div>
</section>
<!-- Description Card with Editor -->
<section class="bg-white dark:bg-gray-900 rounded shadow-[0_2px_15px_-3px_rgba(0,0,0,0.07)] border border-gray-50 dark:border-gray-800 overflow-hidden">
<div class="p-5 pb-2">
<h2 class="text-xs font-bold uppercase tracking-widest text-primary">Full Description</h2>
</div>
<!-- Minimalist Toolbar -->
<div class="flex items-center gap-1 px-4 py-2 border-y border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/50 overflow-x-auto no-scrollbar">
<button class="p-2 hover:bg-white dark:hover:bg-gray-700 rounded transition-colors">
<span class="material-symbols-outlined text-xl">format_bold</span>
</button>
<button class="p-2 hover:bg-white dark:hover:bg-gray-700 rounded transition-colors">
<span class="material-symbols-outlined text-xl">format_italic</span>
</button>
<div class="w-px h-6 bg-gray-200 dark:bg-gray-700 mx-1"></div>
<button class="p-2 hover:bg-white dark:hover:bg-gray-700 rounded transition-colors">
<span class="material-symbols-outlined text-xl">link</span>
</button>
<button class="p-2 hover:bg-white dark:hover:bg-gray-700 rounded transition-colors">
<span class="material-symbols-outlined text-xl">image</span>
</button>
<div class="w-px h-6 bg-gray-200 dark:bg-gray-700 mx-1"></div>
<button class="p-2 hover:bg-white dark:hover:bg-gray-700 rounded transition-colors">
<span class="material-symbols-outlined text-xl">format_h1</span>
</button>
<button class="p-2 hover:bg-white dark:hover:bg-gray-700 rounded transition-colors">
<span class="material-symbols-outlined text-xl">format_list_bulleted</span>
</button>
</div>
<textarea class="w-full min-h-[250px] p-5 border-none focus:ring-0 bg-transparent text-base leading-relaxed placeholder:text-gray-400" placeholder="Start typing the detailed product specifications and features..."></textarea>
</section>
</main>
<!-- Fixed Footer Action -->
<div class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-background-dark/90 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 p-4 z-50">
<div class="max-w-xl mx-auto flex gap-4">
<button class="flex-1 h-12 bg-gray-100 dark:bg-gray-800 text-sm font-bold rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                Save Draft
            </button>
<button class="flex-[2] h-12 bg-primary text-white text-sm font-bold rounded-lg shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Publish Product</span>
<span class="material-symbols-outlined text-xl">send</span>
</button>
</div>
</div>
</body></html>
