version: "3.8"

services:
  # Backend API
  backend:
    build:
      context: ./dfkorea-backend
      dockerfile: Dockerfile
    container_name: led-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./dfkorea-backend/.env.production
    volumes:
      - ./dfkorea-backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - led-network

  # Frontend
  frontend:
    build:
      context: ./led-lighting-website
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:?set FRONTEND_API_BASE_URL in the root .env to a public https://.../api URL}"
    container_name: led-frontend
    ports:
      - "80:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - led-network

networks:
  led-network:
    driver: bridge
